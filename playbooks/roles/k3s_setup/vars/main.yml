# Rol vars'i: BILEREK ezilemez degerler. Kullanicinin degistirecegi her sey
# defaults/main.yml'de (oradan envanter / group_vars / -e ile ezilebilir).
#
# k3s server/agent flag'leri CLI'da degil, k3s'in kendi ayar dosyasinda:
# templates/k3s-config.yaml.j2 -> /etc/rancher/k3s/config.yaml (03_k3s_config.yml).
# Burasi BOS kalmali. Ayni anahtar hem CLI'da hem config.yaml'da verilirse CLI
# kazanir; ustelik kube-apiserver-arg gibi liste flag'lerinde config'teki
# listenin TAMAMINI ezer ve audit/PSA ayarlari sessizce kaybolur. Bu yuzden
# defaults'ta degil vars'ta: group_vars'tan yanlislikla doldurulamasin.
k3s_server_args: ""
