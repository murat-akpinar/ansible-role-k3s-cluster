---
# k3s'in manifests dizinine kopyalanir; helm-controller bunu gomulu traefik
# HelmChart'i ile birlestirir, restart gerekmez.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    # Chart'in varsayilan Gateway'i yalnizca HTTP:8000 uretir, sertifika alamaz;
    # kendi Gateway'imizi kullaniyoruz. GatewayClass bundan etkilenmez.
    gateway:
      enabled: false
