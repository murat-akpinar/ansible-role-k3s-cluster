---
# Pod Security Admission varsayilan politikasi.
# /var/lib/rancher/k3s/server/psa.yaml olarak yazilir, apiserver'a
# admission-control-config-file ile verilir. PodSecurity admission k3s'te zaten
# acik; eksik olan yalnizca bu politika dosyasiydi.
#
# enforce: baseline -> privileged pod, hostPath, hostPID/hostNetwork reddedilir.
# CIS "restricted" der ama cluster genelinde restricted MetalLB speaker,
# Longhorn ve node-exporter'i kirar; onlar asagida muaf. Kendi is yuklerinizi
# restricted'a tasimak icin once warn/audit ciktisina bakin.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: "baseline"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        usernames: []
        runtimeClasses: []
        # Ayricalikli calismak ZORUNDA olan bilesenler. Namespace'in var olmamasi
        # sorun degil; bileseni kapaliysa satir bos yere durur.
        namespaces:
          - kube-system          # traefik, coredns, local-path, metrics-server
          - longhorn-system      # privileged + hostPath (iSCSI)
          - metallb-system       # speaker: NET_ADMIN + hostNetwork
          - monitoring           # node-exporter: hostPID + hostNetwork
          - cattle-system        # Rancher agent'lari
