---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - grafana.homelab.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
