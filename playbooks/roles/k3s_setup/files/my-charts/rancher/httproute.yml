---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rancher
  namespace: cattle-system
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - rancher.homelab.local
  rules:
    - backendRefs:
        # Backend HTTP/80 olmali: HTTPS/443 verilince Traefik rancher'in
        # self-signed sertifikasini dogrulayamayip 500 donduruyor.
        - name: rancher
          port: 80
