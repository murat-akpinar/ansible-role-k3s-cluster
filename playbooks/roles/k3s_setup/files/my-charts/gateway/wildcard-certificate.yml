---
# Gateway ile ayni namespace'te durur; boylece certificateRefs cross-namespace
# olmaz ve ReferenceGrant gerekmez.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard
  namespace: kube-system
spec:
  secretName: homelab-wildcard-tls
  duration: 8760h
  renewBefore: 2160h
  commonName: "*.homelab.local"
  dnsNames:
    - "*.homelab.local"
    - "homelab.local"
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
