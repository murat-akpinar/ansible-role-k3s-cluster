---
# Tum servislerin paylastigi tek Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: kube-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      # Traefik'in ENTRYPOINT portu (websecure). Servis disariya 443 yayinlar;
      # buraya 443 yazilirsa eslesen entryPoint bulunamaz.
      port: 8443
      hostname: "*.homelab.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: homelab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
