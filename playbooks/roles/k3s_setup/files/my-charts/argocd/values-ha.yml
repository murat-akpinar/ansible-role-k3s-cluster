# ArgoCD values for HA setup (3+ masters)
# Master'a SABITLENMEZ: master taint'i tolere edilmedigi icin pod'lar worker'lara
# yerlesir. podAntiAffinity (preferred) ile replikalar mumkunse farkli node'lara dagilir.

# Server configuration
server:
  replicas: 2

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argocd-server
            topologyKey: "kubernetes.io/hostname"

# Application Controller configuration
controller:
  replicas: 2

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argocd-application-controller
            topologyKey: "kubernetes.io/hostname"

# Repo Server configuration
repoServer:
  replicas: 2

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argocd-repo-server
            topologyKey: "kubernetes.io/hostname"

# ApplicationSet Controller configuration
applicationSet:
  replicas: 2

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argocd-applicationset-controller
            topologyKey: "kubernetes.io/hostname"

# Configs - ArgoCD configuration parameters
configs:
  params:
    # Insecure mode (HTTP backend)
    # TLS Gateway tarafinda sonlandirilir, backend ile HTTP konusulur
    "server.insecure": "true"

# Redis configuration
# NOT: chart'ta redis.replicas yok; redis tek instance calisir.
# Gercek redis HA icin redis-ha subchart'i gerekir (redis-ha.enabled: true).
redis:

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argocd-redis
            topologyKey: "kubernetes.io/hostname"
