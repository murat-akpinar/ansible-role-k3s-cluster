# ArgoCD values for Single Master setup
# Master'a SABITLENMEZ: master taint'i tolere edilmedigi icin pod'lar worker'lara yerlesir.
# Tek replika oldugu icin podAntiAffinity'ye gerek yok.

# Server configuration
server:
  replicas: 1

# Application Controller configuration
controller:
  replicas: 1

# Repo Server configuration
repoServer:
  replicas: 1

# ApplicationSet Controller configuration
applicationSet:
  replicas: 1

# Configs - ArgoCD configuration parameters
configs:
  params:
    # Insecure mode (HTTP backend)
    # TLS Gateway tarafinda sonlandirilir, backend ile HTTP konusulur
    "server.insecure": "true"

# redis ayarlanmiyor: chart'ta redis.replicas yok, tek instance calisir.
# Bos bir "redis:" anahtari null olur ve chart'i patlatir, o yuzden hic yazilmiyor.
