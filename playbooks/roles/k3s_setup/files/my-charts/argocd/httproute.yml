---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - argocd.homelab.local
  rules:
    # match yok -> varsayilan PathPrefix "/"
    - backendRefs:
        # TLS'i Gateway sonlandirir; backend HTTP (values: server.insecure=true).
        - name: argocd-server
          port: 80
