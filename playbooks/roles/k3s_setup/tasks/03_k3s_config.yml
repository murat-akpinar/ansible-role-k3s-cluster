---
# ============================================================================
# k3s ayar dosyasi + sikilastirma politikalari
# ============================================================================
# k3s BASLAMADAN ONCE calismali: apiserver audit ve PSA dosyalarini acilista
# okur, yoksa baslamaz. Uc rol de bu dosyayi cagirir (k3s_setup import_tasks,
# extra_node_cluster / update_cluster include_role tasks_from) — yani ayarlar
# ilk kurulumda, node eklemede ve upgrade'de ayni yerden gelir.
# Kapatmak icin: k3s_hardening: false (defaults/main.yml).

- name: "Hardening | Ensure k3s configuration directory exists"
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    # 0755: ansible_user'in ~/.kube/config symlink'i buradaki k3s.yaml'i
    # gosteriyor, dizin traverse edilebilir kalmali.
    mode: '0755'
  become: true

# Bu sysctl'ler config.yaml ile AYNI task dosyasinda olmali: protect-kernel-defaults
# bunlar ayarli degilse kubelet'i hic baslatmaz ve upgrade.yml
# 00_system_requirements.yml'i calistirmiyor. Ikisini ayirmak, eski bir cluster'i
# upgrade ederken cluster'i dusururdu.
- name: "Hardening | Set kernel parameters required by protect-kernel-defaults"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k3s-hardening.conf
    state: present
    reload: true
  loop:
    # CIS 4.2.6 / k3s security-hardening-guide. keys.* modern kernel'de zaten bu
    # degerde; eski host'ta da tutsun diye acikca yaziyoruz.
    # DIKKAT: kernel.panic=10 -> panic sonrasi host 10 sn icinde yeniden baslar.
    - { name: vm.panic_on_oom, value: "0" }
    - { name: vm.overcommit_memory, value: "1" }
    - { name: kernel.panic, value: "10" }
    - { name: kernel.panic_on_oops, value: "1" }
    - { name: kernel.keys.root_maxkeys, value: "1000000" }
    - { name: kernel.keys.root_maxbytes, value: "25000000" }
  become: true
  when: k3s_hardening | default(true) | bool

- name: "Hardening | Ensure k3s server directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /var/lib/rancher/k3s/server
    - /var/lib/rancher/k3s/server/logs
    # k3s de 0700 aciyor; copy module ust dizini olusturmaz.
    - /var/lib/rancher/k3s/server/manifests
  become: true
  when:
    - "'master' in group_names"
    - k3s_hardening | default(true) | bool

- name: "Hardening | Deploy API server audit policy"
  ansible.builtin.copy:
    src: k3s-audit-policy.yaml
    dest: /var/lib/rancher/k3s/server/audit.yaml
    owner: root
    group: root
    mode: '0600'
  become: true
  register: k3s_audit_policy_file
  when:
    - "'master' in group_names"
    - k3s_hardening | default(true) | bool

- name: "Hardening | Deploy Pod Security Admission policy"
  ansible.builtin.copy:
    src: k3s-psa.yaml
    dest: /var/lib/rancher/k3s/server/psa.yaml
    owner: root
    group: root
    mode: '0600'
  become: true
  register: k3s_psa_policy_file
  when:
    - "'master' in group_names"
    - k3s_hardening | default(true) | bool

# CIS 5.3.2. k3s manifests dizinini izler: calisan cluster'da restart gerekmeden,
# kurulmamissa k3s ilk acilista uygular. Dosyayi silmek policy'leri SILMEZ
# (kubectl delete netpol gerekir).
- name: "Hardening | Deploy NetworkPolicies for k3s core namespaces"
  ansible.builtin.copy:
    src: k3s-network-policy.yaml
    dest: /var/lib/rancher/k3s/server/manifests/k3s-network-policy.yaml
    owner: root
    group: root
    mode: '0600'
  become: true
  when:
    - "'master' in group_names"
    - k3s_hardening | default(true) | bool

- name: "Hardening | Deploy k3s configuration file"
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    # 0600: agent-token gibi secret'lar bu dosyada durur.
    mode: '0600'
  become: true
  register: k3s_config_file

# Calisan bir k3s ayar dosyasini ve apiserver audit/PSA dosyalarini kendiliginden
# yeniden okumaz. Otomatik restart YAPMIYORUZ: HA'da tum master'lari ayni anda
# yeniden baslatmak API kesintisidir.
- name: "Hardening | Check whether k3s is already running on this node"
  ansible.builtin.command: "systemctl is-active {{ 'k3s' if 'master' in group_names else 'k3s-agent' }}"  # noqa: command-instead-of-module
  register: k3s_already_running
  changed_when: false
  failed_when: false
  become: true

- name: "Hardening | Warn that a running k3s must be restarted to load the new config"
  ansible.builtin.debug:
    msg: >-
      k3s ayar dosyasi (config.yaml) ya da audit/PSA politikasi degisti ama bu node'da
      k3s zaten calisiyor.
      Yeni ayarlar icin elle yeniden baslatin:
      systemctl restart {{ 'k3s' if 'master' in group_names else 'k3s-agent' }}
      (HA'da master'lari TEK TEK, aralarinda 'kubectl get nodes' ile bekleyerek.)
      upgrade.yml zaten yeniden kurdugu icin orada gerek yok.
  when:
    - k3s_config_file is changed or k3s_audit_policy_file is changed or k3s_psa_policy_file is changed
    - (k3s_already_running.rc | default(1)) == 0
