---
# ============================
# Check system requirements
# ============================

- name: Check minimum CPU requirements
  ansible.builtin.command: grep -c ^processor /proc/cpuinfo
  register: cpu_count
  changed_when: false
  ignore_errors: true

- name: Verify CPU count
  ansible.builtin.fail:
    msg: "System does not have minimum required CPU cores (4)."
  when: cpu_count.stdout|int < 3
  ignore_errors: true


- name: Check minimum RAM requirements
  ansible.builtin.shell: free -m | awk '/^Mem:/ {print $2}'
  register: ram_size
  changed_when: false
  failed_when: ram_size.stdout|int < 4096
  ignore_errors: true

# ============================
# Kernel & Swap Hazırlığı (Kubernetes ağ ön gereksinimleri)
# ============================

- name: Disable swap at runtime
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Disable swap permanently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Ensure required kernel modules are loaded
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  failed_when: false

- name: Persist kernel modules across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

- name: Set required sysctl parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k3s.conf
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
  failed_when: false

# ============================
# NTP (chrony) — etcd saat kaymasina duyarli oldugu icin zorunlu
# ============================

- name: Ensure chrony is installed
  ansible.builtin.package:
    name: chrony
    state: present

- name: Deploy Chrony configuration
  ansible.builtin.template:
    src: chrony.j2
    dest: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart NTP service

- name: Ensure chrony service is enabled and running
  ansible.builtin.service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: started
    enabled: true
