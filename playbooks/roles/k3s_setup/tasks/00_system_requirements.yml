---
# ============================
# Check system requirements
# ============================

# Uyari, durdurma degil (eskiden fail + ignore_errors). Degerler fact'lerden:
# processor_vcpus = /proc/cpuinfo processor sayisi, memtotal_mb = MemTotal.
- name: Warn if the node is below the recommended CPU / RAM
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ ansible_facts['processor_vcpus'] }} vCPU / {{ ansible_facts['memtotal_mb'] }} MB RAM,
      recommended at least 3 vCPU / 4096 MB.
  when: ansible_facts['processor_vcpus'] < 3 or ansible_facts['memtotal_mb'] < 4096

# ============================
# Kernel & Swap Hazırlığı (Kubernetes ağ ön gereksinimleri)
# ============================

- name: Disable swap at runtime
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Disable swap permanently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Ensure required kernel modules are loaded
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  failed_when: false

- name: Persist kernel modules across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

- name: Set required sysctl parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k3s.conf
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
  # protect-kernel-defaults'un istedigi sysctl'ler burada DEGIL, 03_k3s_config.yml'de:
  # upgrade.yml bu dosyayi hic calistirmiyor, ayar dosyasiyla on kosulu ayirmak
  # eski bir cluster'i upgrade'de kubelet baslamaz hale getirirdi.
  failed_when: false

# ============================
# NTP (chrony) — etcd saat kaymasina duyarli oldugu icin zorunlu
# ============================

- name: Ensure chrony is installed
  ansible.builtin.package:
    name: chrony
    state: present

- name: Deploy Chrony configuration
  ansible.builtin.template:
    src: chrony.j2
    dest: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart NTP service

- name: Ensure chrony service is enabled and running
  ansible.builtin.service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: started
    enabled: true
