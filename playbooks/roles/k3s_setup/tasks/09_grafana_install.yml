---
# ============================
# Install kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
# ============================

- name: Render kube-prometheus-stack values from variables (storageClass)
  ansible.builtin.template:
    src: kube-prometheus-stack-values.yml.j2
    dest: "{{ user_home_directory }}/my-charts/grafana/kube-prometheus-stack-values.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when:
    - "'master' in group_names"
    - user_home_directory is defined

- name: Install kube-prometheus-stack Helm chart
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install kube-prometheus-stack kube-prometheus-stack --repo {{ helm_repo_prometheus }}
      --wait --timeout 10m --namespace monitoring --create-namespace
      {{ ('--version ' ~ kube_prometheus_stack_chart_version) if kube_prometheus_stack_chart_version else '' }}
      -f {{ user_home_directory }}/my-charts/grafana/kube-prometheus-stack-values.yml
      {{ ('-f ' ~ user_home_directory ~ '/my-charts/grafana/kube-prometheus-stack-values-single-master.yml')
      if (master_count | default(0) | int) < 3 else '' }}
      -f {{ user_home_directory }}/my-charts/grafana/kube-prometheus-stack-values-master-only.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: kube_prometheus_stack_helm_result
  until: kube_prometheus_stack_helm_result.rc == 0
  changed_when: true
  retries: 3
  delay: 30
  when: inventory_hostname == groups['master'][0]

# helm --wait Grafana/operator Deployment'larini ve PVC'leri bekler; Prometheus
# StatefulSet'ini chart degil operator olusturur, onu CR'in kosulu gosterir.
- name: Wait for Prometheus to become available
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Available --timeout=600s -n monitoring prometheuses.monitoring.coreos.com/kube-prometheus-stack-prometheus
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Apply Grafana HTTPRoute
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/grafana/httproute.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: grafana_httproute_apply
  changed_when: grafana_httproute_apply.stdout is search('(created|configured)$', multiline=True)
  when:
    - inventory_hostname == groups['master'][0]
    - cert_manager_install | default(false)

- name: Retrieve Grafana admin password
  ansible.builtin.command: >-
    kubectl get secret --namespace monitoring kube-prometheus-stack-grafana
    -o go-template='{% raw %}{{ index .data "admin-password" | base64decode }}{% endraw %}'
  register: grafana_admin_password
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Display Grafana admin password
  ansible.builtin.debug:
    msg: "Grafana admin password: {{ grafana_admin_password.stdout }}"
  when: inventory_hostname == groups['master'][0]

- name: Retrieve Grafana admin user
  ansible.builtin.command: >-
    kubectl get secret --namespace monitoring kube-prometheus-stack-grafana
    -o go-template='{% raw %}{{ index .data "admin-user" | base64decode }}{% endraw %}'
  register: grafana_admin_user
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Display Grafana admin user
  ansible.builtin.debug:
    msg: "Grafana admin user: {{ grafana_admin_user.stdout }}"
  when: inventory_hostname == groups['master'][0]

- name: Retrieve Prometheus service URL
  ansible.builtin.shell: >
    kubectl get svc -n monitoring kube-prometheus-stack-prometheus -o jsonpath="{.spec.clusterIP}"
  register: prometheus_server_ip
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Display Prometheus service IP address
  ansible.builtin.debug:
    msg: "Prometheus service IP address: {{ prometheus_server_ip.stdout }}"
  when: inventory_hostname == groups['master'][0]

- name: Display Prometheus data URL
  ansible.builtin.debug:
    msg: "Prometheus data URL: {{ prometheus_data_url }}"
  when: inventory_hostname == groups['master'][0]
