---
# ============================
# Install Cert-Manager
# ============================

- name: Check if Jetstack Helm repository is already added
  ansible.builtin.command:
    cmd: helm repo list
  register: helm_repo_list
  failed_when: false
  changed_when: false
  become: true
  become_user: "{{ ansible_user }}"
  when: "'master' in group_names"

- name: Fail if helm repo list failed for reasons other than no repositories
  ansible.builtin.fail:
    msg: "Failed to list Helm repositories: {{ helm_repo_list.stderr }}"
  when: 
    - "'master' in group_names"
    - helm_repo_list.rc != 0
    - "'no repositories' not in helm_repo_list.stderr | default('')"

- name: Extract Helm repository names
  ansible.builtin.shell: |
    echo "{{ helm_repo_list.stdout }}" | awk 'NR > 1 {print $1}'
  register: helm_repo_names
  when: "'master' in group_names"

- name: Check if Jetstack Helm repository is already present
  ansible.builtin.set_fact:
    jetstack_repo_present: "{{ 'jetstack' in helm_repo_names.stdout }}"
  when: "'master' in group_names"

- name: Debug if Jetstack Helm repository is present
  ansible.builtin.debug:
    msg: "Jetstack Helm repository is present: {{ jetstack_repo_present }}"
  when: "'master' in group_names"

- name: Add Jetstack Helm repository
  ansible.builtin.command:
    cmd: helm repo add jetstack {{ helm_repo_cert_manager }}
  become: true
  become_user: "{{ ansible_user }}"
  when: 
    - "'master' in group_names"
    - not jetstack_repo_present

- name: Debug message if Jetstack Helm repository is already present
  ansible.builtin.debug:
    msg: "Jetstack Helm repository is already added."
  when:
    - "'master' in group_names"
    - jetstack_repo_present

- name: Update Helm repository list
  ansible.builtin.command:
    cmd: helm repo update
  become: true
  become_user: "{{ ansible_user }}"
  when: 
    - "'master' in group_names"

- name: Count the number of master nodes
  set_fact:
    master_count: "{{ groups['master'] | length | int }}"
  when: "'master' in group_names"
  run_once: true

- name: Set cert-manager values file for HA (3+ masters)
  set_fact:
    cert_manager_values_file: "{{ user_home_directory }}/my-charts/cert-manager/values-ha.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) >= 3
  run_once: true

- name: Set cert-manager values file for single master
  set_fact:
    cert_manager_values_file: "{{ user_home_directory }}/my-charts/cert-manager/values-single-master.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) < 3
  run_once: true

- name: Install Cert-Manager Helm chart
  ansible.builtin.command:
    cmd: helm upgrade --install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace {{ ('--version ' ~ cert_manager_chart_version) if cert_manager_chart_version else '' }} --set crds.enabled=true -f {{ cert_manager_values_file }}
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: cert_manager_helm_result
  until: cert_manager_helm_result.rc == 0
  retries: 5
  delay: 30
  when: inventory_hostname == groups['master'][0]

- name: Wait for Cert-Manager pods to be in Running state
  command: kubectl get pods -n cert-manager -l app.kubernetes.io/name=cert-manager -o jsonpath='{.items[*].status.phase}'
  register: cert_manager_pod_status
  until: cert_manager_pod_status.stdout.find('Running') != -1
  retries: 10
  delay: 60
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Apply selfsigned issuer
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/cert-manager/selfsigned-issuer.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  when:
    - inventory_hostname == groups['master'][0]

# ============================
# Paylasimli Gateway (*.{{ cluster_domain }}) - issuer'a bagli oldugu icin burada
# ============================

- name: Apply wildcard certificate for *.{{ cluster_domain }}
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/gateway/wildcard-certificate.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  when:
    - inventory_hostname == groups['master'][0]

- name: Wait for wildcard certificate to be issued
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready --timeout=180s -n kube-system certificate/homelab-wildcard
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: wildcard_cert_ready
  until: wildcard_cert_ready.rc == 0
  retries: 3
  delay: 20
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]

- name: Apply shared homelab Gateway
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/gateway/gateway.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  when:
    - inventory_hostname == groups['master'][0]

- name: Wait for homelab Gateway to be Programmed
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Programmed --timeout=180s -n kube-system gateway/homelab
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: homelab_gateway_programmed
  until: homelab_gateway_programmed.rc == 0
  retries: 3
  delay: 20
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]
