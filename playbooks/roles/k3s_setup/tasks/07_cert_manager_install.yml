---
# ============================
# Install Cert-Manager
# ============================

- name: Set cert-manager values file for HA (3+ masters)
  ansible.builtin.set_fact:
    cert_manager_values_file: "{{ user_home_directory }}/my-charts/cert-manager/values-ha.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) >= 3
  run_once: true

- name: Set cert-manager values file for single master
  ansible.builtin.set_fact:
    cert_manager_values_file: "{{ user_home_directory }}/my-charts/cert-manager/values-single-master.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) < 3
  run_once: true

- name: Install Cert-Manager Helm chart
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install cert-manager cert-manager --repo {{ helm_repo_cert_manager }}
      --wait --timeout 10m --namespace cert-manager --create-namespace
      {{ ('--version ' ~ cert_manager_chart_version) if cert_manager_chart_version else '' }}
      --set crds.enabled=true -f {{ cert_manager_values_file }}
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: cert_manager_helm_result
  until: cert_manager_helm_result.rc == 0
  changed_when: true
  retries: 3
  delay: 30
  when: inventory_hostname == groups['master'][0]

- name: Apply selfsigned issuer
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/cert-manager/selfsigned-issuer.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  # helm --wait webhook pod'unu Ready bekler; cainjector'in CA'yi webhook
  # config'ine yazmasi birkac saniye daha surebilir.
  register: selfsigned_issuer_apply
  until: selfsigned_issuer_apply.rc == 0
  retries: 6
  delay: 10
  changed_when: selfsigned_issuer_apply.stdout is search('(created|configured)$', multiline=True)
  when:
    - inventory_hostname == groups['master'][0]

# ============================
# Paylasimli Gateway (*.{{ cluster_domain }}) - issuer'a bagli oldugu icin burada
# ============================

- name: Apply wildcard certificate for *.{{ cluster_domain }}
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/gateway/wildcard-certificate.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: wildcard_cert_apply
  changed_when: wildcard_cert_apply.stdout is search('(created|configured)$', multiline=True)
  when:
    - inventory_hostname == groups['master'][0]

- name: Wait for wildcard certificate to be issued
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready --timeout=180s -n kube-system certificate/homelab-wildcard
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: wildcard_cert_ready
  until: wildcard_cert_ready.rc == 0
  retries: 3
  delay: 20
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]

- name: Apply shared homelab Gateway
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/gateway/gateway.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: homelab_gateway_apply
  changed_when: homelab_gateway_apply.stdout is search('(created|configured)$', multiline=True)
  when:
    - inventory_hostname == groups['master'][0]

- name: Wait for homelab Gateway to be Programmed
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Programmed --timeout=180s -n kube-system gateway/homelab
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: homelab_gateway_programmed
  until: homelab_gateway_programmed.rc == 0
  retries: 3
  delay: 20
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]
