---
# ============================
# Install Rancher
# ============================

- name: Render Rancher deployment from variables (rancher_version)
  ansible.builtin.template:
    src: rancher-deployment.yml.j2
    dest: "{{ user_home_directory }}/my-charts/rancher/rancher-deployment.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when:
    - "'master' in group_names"
    - user_home_directory is defined

- name: Install rancher via kubectl apply
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/rancher/rancher-deployment.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: rancher_apply_result
  until: rancher_apply_result.rc == 0
  retries: 5
  delay: 30
  when: inventory_hostname == groups['master'][0]

- name: Wait for Rancher pods to be in Running state
  command: kubectl get pods -n cattle-system -l app=rancher -o jsonpath='{.items[*].status.phase}'
  register: rancher_pod_status
  until: rancher_pod_status.stdout.find('Running') != -1
  retries: 15
  delay: 30
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Apply Rancher HTTPRoute
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/rancher/httproute.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  when:
    - inventory_hostname == groups['master'][0]
    - cert_manager_install | default(false)

- name: Wait for bootstrap-secret to be created
  command: kubectl get secret -n cattle-system bootstrap-secret
  register: bootstrap_secret_check
  until: bootstrap_secret_check.rc == 0
  retries: 20
  delay: 10
  failed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Get Rancher bootstrap password from secret
  shell: kubectl get secret --namespace cattle-system bootstrap-secret -o go-template='{% raw %}{{.data.bootstrapPassword|base64decode}}{{"\n"}}{% endraw %}'
  register: rancher_bootstrap_password_raw
  when: inventory_hostname == groups['master'][0]

- name: Extract Rancher bootstrap password
  set_fact:
    rancher_bootstrap_password: "{{ rancher_bootstrap_password_raw.stdout | trim }}"
  when: inventory_hostname == groups['master'][0]

- name: Show Rancher bootstrap password
  debug:
    msg: "Rancher Bootstrap Password: {{ rancher_bootstrap_password }}"
  when: inventory_hostname == groups['master'][0]
