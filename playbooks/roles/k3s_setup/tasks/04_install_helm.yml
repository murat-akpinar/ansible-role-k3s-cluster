---
# ============================
# Install Helm
# ============================

# Kurulu surum helm_version'dan farkliysa (ya da helm yoksa) kurar/yukseltir.
- name: Get installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_installed
  failed_when: false
  changed_when: false
  check_mode: false
  when: "'master' in group_names"

# Resmi release arsivi, script yok. get-helm-3'un checksum'i da ayni sunucudan
# geliyordu; TLS'ten fazla guvence vermiyordu.
- name: Install Helm
  ansible.builtin.unarchive:
    src: "{{ helm_download_url }}/helm-{{ helm_version }}-{{ helm_dist }}.tar.gz"
    remote_src: true
    dest: /usr/local/bin
    include: "{{ helm_dist }}/helm"
    extra_opts: [--strip-components=1]
    owner: root
    group: root
  vars:
    helm_dist: "linux-{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'arm'}[ansible_facts['architecture']] }}"
  when:
    - "'master' in group_names"
    - helm_installed.stdout.split('+')[0] != helm_version

- name: Ensure K3S server is enabled and running
  ansible.builtin.systemd:
    name: k3s.service
    enabled: true
    state: started
  when: "'master' in group_names"

- name: Copy my-charts directory to user's home directory
  ansible.builtin.copy:
    src: ./my-charts/
    dest: "{{ user_home_directory }}/my-charts/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when:
    - "'master' in group_names"
    - user_home_directory is defined

# Domain iceren manifest'ler tek degiskenden (cluster_domain) uretilir.
- name: Render domain-dependent manifests into my-charts
  ansible.builtin.template:
    src: "my-charts/{{ item }}.j2"
    dest: "{{ user_home_directory }}/my-charts/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop:
    - gateway/gateway.yml
    - gateway/wildcard-certificate.yml
    - argocd/httproute.yml
    - grafana/httproute.yml
    - rancher/httproute.yml
  when:
    - "'master' in group_names"
    - user_home_directory is defined
