---
# ============================
# Install Helm
# ============================

- name: Check if Helm is installed
  command: which helm
  register: helm_installed
  failed_when: false
  changed_when: false
  check_mode: no
  when: "'master' in group_names"

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: "{{ helm_install_script_url }}"
    dest: /tmp/get_helm.sh
    mode: '0700'
  when:
  - "'master' in group_names"
  - helm_installed.rc != 0

- name: Install Helm
  ansible.builtin.shell:
    cmd: /tmp/get_helm.sh
    creates: /usr/local/bin/helm
  when: 
  - "'master' in group_names"
  - helm_installed.rc != 0

- name: Ensure K3S server is enabled and running
  ansible.builtin.systemd:
    name: k3s.service
    enabled: true
    state: started
  when: "'master' in group_names"

- name: Copy my-charts directory to user's home directory
  copy:
    src: ./my-charts/
    dest: "{{ user_home_directory }}/my-charts/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when:
  - "'master' in group_names"
  - user_home_directory is defined

# Domain iceren manifest'ler tek degiskenden (cluster_domain) uretilir.
- name: Render domain-dependent manifests into my-charts
  ansible.builtin.template:
    src: "my-charts/{{ item }}.j2"
    dest: "{{ user_home_directory }}/my-charts/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop:
    - gateway/gateway.yml
    - gateway/wildcard-certificate.yml
    - argocd/httproute.yml
    - grafana/httproute.yml
    - longhorn/httproute.yml
    - rancher/httproute.yml
  when:
  - "'master' in group_names"
  - user_home_directory is defined
