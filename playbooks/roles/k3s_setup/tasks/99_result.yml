---
# ============================
# Display Installation Results
# ============================

- name: Get homelab Gateway address
  ansible.builtin.command: kubectl get gateway -n kube-system homelab -o jsonpath='{.status.addresses[0].value}'
  register: gateway_address
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]

- name: Retrieve Rancher bootstrap password
  ansible.builtin.command: >-
    kubectl get secret --namespace cattle-system bootstrap-secret
    -o go-template='{% raw %}{{.data.bootstrapPassword|base64decode}}{% endraw %}'
  register: rancher_bootstrap_password
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]
    - rancher_install | default(false)

- name: Retrieve Rancher URL
  ansible.builtin.set_fact:
    rancher_url: "https://rancher.{{ cluster_domain }}"
  when:
    - inventory_hostname == groups['master'][0]
    - rancher_install | default(false)

- name: Retrieve Grafana admin password
  ansible.builtin.command: >-
    kubectl get secret --namespace monitoring kube-prometheus-stack-grafana
    -o go-template='{% raw %}{{ index .data "admin-password" | base64decode }}{% endraw %}'
  register: grafana_admin_password
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]
    - grafana_install | default(false)

- name: Retrieve Grafana admin user
  ansible.builtin.command: >-
    kubectl get secret --namespace monitoring kube-prometheus-stack-grafana
    -o go-template='{% raw %}{{ index .data "admin-user" | base64decode }}{% endraw %}'
  register: grafana_admin_user
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]
    - grafana_install | default(false)

- name: Retrieve Grafana URL
  ansible.builtin.set_fact:
    grafana_url: "https://grafana.{{ cluster_domain }}"
  when:
    - inventory_hostname == groups['master'][0]
    - grafana_install | default(false)

- name: Retrieve ArgoCD admin password
  ansible.builtin.command: >-
    kubectl get secret -n argocd argocd-initial-admin-secret -o go-template='{% raw %}{{ .data.password | base64decode }}{% endraw %}'
  register: argocd_admin_password
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]
    - argocd_install | default(false)

- name: Retrieve ArgoCD URL
  ansible.builtin.set_fact:
    argocd_url: "https://argocd.{{ cluster_domain }}"
  when:
    - inventory_hostname == groups['master'][0]
    - argocd_install | default(false)


- name: Display Installation Summary
  ansible.builtin.debug:
    msg: "{{ summary_lines | select() | list }}"
  vars:
    bar: "======================================================================"
    summary_lines:
      - "{{ bar }}"
      - "                    K3s CLUSTER KURULUM OZETI"
      - "{{ bar }}"
      - "{{ 'Gateway  | LoadBalancer IP : ' ~ (gateway_address.stdout | default('') | trim | default('N/A', true)) }}"
      - "{{ ('Rancher  | ' ~ (rancher_url | default('N/A')) ~ '  ->  admin / ' ~ (rancher_bootstrap_password.stdout | default('N/A')))
          if (rancher_install | default(false)) else '' }}"
      - "{{ ('Grafana  | ' ~ (grafana_url | default('N/A')) ~ '  ->  ' ~ (grafana_admin_user.stdout | default('admin'))
          ~ ' / ' ~ (grafana_admin_password.stdout | default('N/A'))) if (grafana_install | default(false)) else '' }}"
      - "{{ ('ArgoCD   | ' ~ (argocd_url | default('N/A')) ~ '  ->  admin / ' ~ (argocd_admin_password.stdout | default('N/A')))
          if (argocd_install | default(false)) else '' }}"
      - "{{ bar }}"
      - "Not: URL'lere erisim icin /etc/hosts dosyaniza MetalLB LoadBalancer IP'sini ekleyin."
      - "{{ bar }}"
  when:
    - inventory_hostname == groups['master'][0]
