---
# ============================
# Display Installation Results
# ============================

- name: Get homelab Gateway address
  command: kubectl get gateway -n kube-system homelab -o jsonpath='{.status.addresses[0].value}'
  register: gateway_address
  failed_when: false
  changed_when: false
  when:
    - inventory_hostname == groups['master'][0]

- name: Retrieve Longhorn URL
  set_fact:
    longhorn_url: "https://longhorn.{{ cluster_domain }}"
  when: 
    - inventory_hostname == groups['master'][0]
    - longhorn_install | default(false)

- name: Retrieve Rancher bootstrap password
  shell: kubectl get secret --namespace cattle-system bootstrap-secret -o go-template='{% raw %}{{.data.bootstrapPassword|base64decode}}{{"\n"}}{% endraw %}' 2>/dev/null || echo ""
  register: rancher_bootstrap_password
  failed_when: false
  changed_when: false
  when: 
    - inventory_hostname == groups['master'][0]
    - rancher_install | default(false)

- name: Retrieve Rancher URL
  set_fact:
    rancher_url: "https://rancher.{{ cluster_domain }}"
  when: 
    - inventory_hostname == groups['master'][0]
    - rancher_install | default(false)

- name: Retrieve Grafana admin password
  shell: kubectl get secret --namespace monitoring kube-prometheus-stack-grafana -o jsonpath="{.data.admin-password}" 2>/dev/null | base64 --decode || echo ""
  register: grafana_admin_password
  failed_when: false
  changed_when: false
  when: 
    - inventory_hostname == groups['master'][0]
    - grafana_install | default(false)

- name: Retrieve Grafana admin user
  shell: kubectl get secret --namespace monitoring kube-prometheus-stack-grafana -o jsonpath="{.data.admin-user}" 2>/dev/null | base64 --decode || echo ""
  register: grafana_admin_user
  failed_when: false
  changed_when: false
  when: 
    - inventory_hostname == groups['master'][0]
    - grafana_install | default(false)

- name: Retrieve Grafana URL
  set_fact:
    grafana_url: "https://grafana.{{ cluster_domain }}"
  when: 
    - inventory_hostname == groups['master'][0]
    - grafana_install | default(false)

- name: Retrieve ArgoCD admin password
  shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo ""
  register: argocd_admin_password
  failed_when: false
  changed_when: false
  when: 
    - inventory_hostname == groups['master'][0]
    - argocd_install | default(false)

- name: Retrieve ArgoCD URL
  set_fact:
    argocd_url: "https://argocd.{{ cluster_domain }}"
  when: 
    - inventory_hostname == groups['master'][0]
    - argocd_install | default(false)


- name: Display Installation Summary
  debug:
    msg: "{{ summary_lines | select() | list }}"
  vars:
    bar: "======================================================================"
    summary_lines:
      - "{{ bar }}"
      - "                    K3s CLUSTER KURULUM OZETI"
      - "{{ bar }}"
      - "{{ 'Gateway  | LoadBalancer IP : ' ~ (gateway_address.stdout | default('') | trim | default('N/A', true)) }}"
      - "{{ ('Longhorn | ' ~ (longhorn_url | default('N/A'))) if (longhorn_install | default(false)) else '' }}"
      - "{{ ('Rancher  | ' ~ (rancher_url | default('N/A')) ~ '  ->  admin / ' ~ (rancher_bootstrap_password.stdout | default('N/A'))) if (rancher_install | default(false)) else '' }}"
      - "{{ ('Grafana  | ' ~ (grafana_url | default('N/A')) ~ '  ->  ' ~ (grafana_admin_user.stdout | default('admin')) ~ ' / ' ~ (grafana_admin_password.stdout | default('N/A'))) if (grafana_install | default(false)) else '' }}"
      - "{{ ('ArgoCD   | ' ~ (argocd_url | default('N/A')) ~ '  ->  admin / ' ~ (argocd_admin_password.stdout | default('N/A'))) if (argocd_install | default(false)) else '' }}"
      - "{{ bar }}"
      - "Not: URL'lere erisim icin /etc/hosts dosyaniza MetalLB LoadBalancer IP'sini ekleyin."
      - "{{ bar }}"
  when:
    - inventory_hostname == groups['master'][0]

