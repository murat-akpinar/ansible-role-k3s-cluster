---
# ============================
# Wellcome Message
# ============================

- name: Create /etc/motd with welcome message
  ansible.builtin.template:
    src: templates/wellcome.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Find dynamic MOTD scripts
  ansible.builtin.find:
    paths: /etc/update-motd.d
    file_type: file
  register: motd_scripts
  become: true

# Silmek yerine exec bitini dusuruyoruz: idempotent ve geri alinabilir.
# sshd /etc/motd'yi her girişte okur, servisi yeniden baslatmaya gerek yok.
- name: Disable dynamic MOTD scripts
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '0644'
  loop: "{{ motd_scripts.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
