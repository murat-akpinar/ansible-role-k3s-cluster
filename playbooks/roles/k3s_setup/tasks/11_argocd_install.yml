---
# ============================
# Install ArgoCD
# ============================

- name: Set argocd values file for HA (3+ masters)
  set_fact:
    argocd_values_file: "{{ user_home_directory }}/my-charts/argocd/values-ha.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) >= 3
  run_once: true

- name: Set argocd values file for single master
  set_fact:
    argocd_values_file: "{{ user_home_directory }}/my-charts/argocd/values-single-master.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) < 3
  run_once: true

- name: Debug selected ArgoCD values file
  debug:
    msg: >-
      ArgoCD kurulum modu: {{ 'HA (3+ master)' if (master_count | default(0) | int) >= 3 else 'Single master (<3 master)' }}
      — secilen values dosyasi: {{ argocd_values_file }}
  when:
    - "'master' in group_names"
    - inventory_hostname == groups['master'][0]
  run_once: true

- name: Install ArgoCD Helm chart
  ansible.builtin.command:
    cmd: helm upgrade --install argocd argo-cd --repo {{ helm_repo_argo }} --wait --timeout 10m --namespace argocd --create-namespace {{ ('--version ' ~ argocd_chart_version) if argocd_chart_version else '' }} -f {{ argocd_values_file }}
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: argocd_helm_result
  until: argocd_helm_result.rc == 0
  retries: 3
  delay: 30
  when: inventory_hostname == groups['master'][0]

- name: Apply ArgoCD HTTPRoute
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/argocd/httproute.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: argocd_httproute_apply
  changed_when: argocd_httproute_apply.stdout is search('(created|configured)$', multiline=True)
  when:
    - inventory_hostname == groups['master'][0]
    - cert_manager_install | default(false)

- name: Retrieve ArgoCD admin password
  ansible.builtin.shell: >
    kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  register: argocd_admin_password
  failed_when: false
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Display ArgoCD admin password
  debug:
    msg: "ArgoCD admin password: {{ argocd_admin_password.stdout }}"
  when: 
    - inventory_hostname == groups['master'][0]
    - argocd_admin_password.rc == 0

- name: Display ArgoCD admin username
  debug:
    msg: "ArgoCD admin username: admin"
  when: inventory_hostname == groups['master'][0]
