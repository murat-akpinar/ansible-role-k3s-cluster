---
# ============================
# Gateway API (CRD + Traefik saglayicisi)
# ============================
# Sira onemli: CRD'ler yoksa helm-controller GatewayClass'i olusturamaz.

# --server-side zorunlu (httproutes CRD'si ~460 KB, annotation siniri 256 KB);
# --force-conflicts eski client-side apply'dan kalan alan sahipligi icin.
- name: Install Gateway API CRDs (standard channel {{ gateway_api_version }})
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts
      -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: gateway_api_crd_result
  until: gateway_api_crd_result.rc == 0
  retries: 5
  delay: 15
  changed_when: false   # SSA ciktisindan degisiklik ayirt edilemiyor
  when: inventory_hostname == groups['master'][0]

- name: Wait for Gateway API CRDs to be established
  ansible.builtin.command:
    cmd: >-
      kubectl wait --for=condition=Established --timeout=120s
      crd/gatewayclasses.gateway.networking.k8s.io
      crd/gateways.gateway.networking.k8s.io
      crd/httproutes.gateway.networking.k8s.io
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Enable Traefik Gateway API provider via HelmChartConfig
  ansible.builtin.copy:
    src: traefik-gateway-config.yml
    dest: /var/lib/rancher/k3s/server/manifests/traefik-gateway-config.yaml
    owner: root
    group: root
    mode: "0644"
  become: true
  when: "'master' in group_names"

# GatewayClass helm job bitene kadar yok; kubectl wait olmayan kaynakta hemen
# hata dondugu icin kisa timeout + cok deneme.
- name: Wait for traefik GatewayClass to be Accepted
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Accepted --timeout=30s gatewayclass/traefik
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: gatewayclass_accepted
  until: gatewayclass_accepted.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  when: inventory_hostname == groups['master'][0]
