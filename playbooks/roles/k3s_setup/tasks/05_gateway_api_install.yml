---
# ============================
# Gateway API (CRD + Traefik saglayicisi)
# ============================
# k3s Gateway API CRD'lerini getirmez; once CRD'leri kuruyoruz, sonra gomulu
# Traefik'in kubernetesGateway saglayicisini aciyoruz. Sira onemli: CRD'ler
# yoksa helm-controller GatewayClass'i olusturamaz ve traefik release'i patlar.

- name: Find home directory for ansible_user
  command: getent passwd {{ ansible_user }}
  register: getent_passwd_output
  changed_when: false
  when: "'master' in group_names"

- name: Set home directory variable
  set_fact:
    user_home_directory: "{{ getent_passwd_output.stdout.split(':')[5] }}"
  when:
    - "'master' in group_names"
    - getent_passwd_output.stdout != ""

- name: Define the user name with ansible_user
  command: getent passwd {{ ansible_user }}
  register: getent_passwd_result
  changed_when: false

- name: Set user name variable from getent passwd output
  set_fact:
    uid_user: "{{ getent_passwd_result.stdout.split(':')[0] }}"
  when: getent_passwd_result.stdout != ''

# --server-side ZORUNLU: httproutes CRD'si tek basina ~460 KB, klasik apply'in
#   yazdigi last-applied-configuration annotation'i 256 KB sinirini asar.
# --force-conflicts: CRD'ler daha once klasik (client-side) apply ile kurulduysa
#   alan sahipligi "kubectl-client-side-apply" manager'inda kalir ve SSA catisir.
- name: Install Gateway API CRDs (standard channel {{ gateway_api_version }})
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts
      -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  become: true
  become_user: "{{ uid_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: gateway_api_crd_result
  until: gateway_api_crd_result.rc == 0
  retries: 5
  delay: 15
  # SSA her calistirmada "serverside-applied" yazar, degisti/degismedi ayrimi
  # ciktidan anlasilamaz; yanlis "changed" raporlamaktansa hic raporlamiyoruz.
  changed_when: false
  when: inventory_hostname == 'master-1'

- name: Wait for Gateway API CRDs to be established
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Established --timeout=120s crd/gateways.gateway.networking.k8s.io crd/httproutes.gateway.networking.k8s.io
  become: true
  become_user: "{{ uid_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  changed_when: false
  when: inventory_hostname == 'master-1'

# Tum master'lara yazilir: k3s her server'in manifests dizinini izler, ayni
# HelmChartConfig birden fazla kez uygulanmasi idempotenttir.
- name: Enable Traefik Gateway API provider via HelmChartConfig
  ansible.builtin.copy:
    src: traefik-gateway-config.yml
    dest: /var/lib/rancher/k3s/server/manifests/traefik-gateway-config.yaml
    owner: root
    group: root
    mode: "0644"
  become: true
  when: "'master' in group_names"

# HelmChartConfig, helm-controller'in traefik release'ini yeniden calistirmasini
# tetikler; GatewayClass o is bitene kadar hic var olmaz. "kubectl wait" olmayan
# bir kaynakta beklemeden hata dondugu icin kisa timeout + cok deneme kullaniyoruz.
- name: Wait for traefik GatewayClass to be Accepted
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Accepted --timeout=30s gatewayclass/traefik
  become: true
  become_user: "{{ uid_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: gatewayclass_accepted
  until: gatewayclass_accepted.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  when: inventory_hostname == 'master-1'
