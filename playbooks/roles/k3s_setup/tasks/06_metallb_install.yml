---
# ============================
# Install MetalLB
# ============================

- name: Set metallb values file for HA (3+ masters)
  ansible.builtin.set_fact:
    metallb_values_file: "{{ user_home_directory }}/my-charts/metallb/values-ha.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) >= 3
  run_once: true

- name: Set metallb values file for single master
  ansible.builtin.set_fact:
    metallb_values_file: "{{ user_home_directory }}/my-charts/metallb/values-single-master.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) < 3
  run_once: true

- name: Install MetalLB using Helm
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install metallb metallb --repo {{ helm_repo_metallb }}
      --wait --timeout 10m --namespace metallb-system --create-namespace
      {{ ('--version ' ~ metallb_chart_version) if metallb_chart_version else '' }}
      -f {{ metallb_values_file }}
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: metallb_helm_result
  until: metallb_helm_result.rc == 0
  changed_when: true
  retries: 3
  delay: 30
  when: inventory_hostname == groups['master'][0]

- name: Render MetalLB IPAddressPool config from variables
  ansible.builtin.template:
    src: metallb-config.yml.j2
    dest: "{{ user_home_directory }}/my-charts/metallb/metallb-config.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: inventory_hostname == groups['master'][0]

- name: Apply MetalLB ConfigMap
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/metallb/metallb-config.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  # IPAddressPool/L2Advertisement validating webhook'tan gecer; helm --wait
  # controller'i Ready bekler ama webhook caBundle'inin yayilmasi birkac saniye
  # surebiliyor; tek deneme yerine kisa araliklarla tekrar dene.
  register: metallb_config_apply
  until: metallb_config_apply.rc == 0
  changed_when: metallb_config_apply.stdout is search('(created|configured)$', multiline=True)
  retries: 6
  delay: 10
  when: inventory_hostname == groups['master'][0]
