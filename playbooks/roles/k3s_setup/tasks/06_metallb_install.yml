---
# ============================
# Install MetalLB
# ============================

- name: Check if MetalLB Helm repository is already added
  ansible.builtin.command:
    cmd: helm repo list
  register: helm_repo_list
  failed_when: false
  changed_when: false
  become: true
  become_user: "{{ ansible_user }}"
  when: "'master' in group_names"

- name: Fail if helm repo list failed for reasons other than no repositories
  ansible.builtin.fail:
    msg: "Failed to list Helm repositories: {{ helm_repo_list.stderr }}"
  when: 
    - "'master' in group_names"
    - helm_repo_list.rc != 0
    - "'no repositories' not in helm_repo_list.stderr | default('')"

- name: Extract Helm repository names
  ansible.builtin.shell: |
    echo "{{ helm_repo_list.stdout }}" | awk 'NR > 1 {print $1}'
  register: helm_repo_names
  when: "'master' in group_names"

- name: Check if MetalLB Helm repository is already present
  ansible.builtin.set_fact:
    metallb_repo_present: "{{ 'metallb' in helm_repo_names.stdout }}"
  when: "'master' in group_names"

- name: Debug if MetalLB Helm repository is present
  ansible.builtin.debug:
    msg: "MetalLB Helm repository is present: {{ metallb_repo_present }}"
  when: "'master' in group_names"

- name: Add MetalLB Helm repository
  ansible.builtin.command:
    cmd: helm repo add metallb {{ helm_repo_metallb }}
  become: true
  become_user: "{{ ansible_user }}"
  when: 
    - "'master' in group_names"
    - not metallb_repo_present

- name: Debug message if MetalLB Helm repository is already present
  ansible.builtin.debug:
    msg: "MetalLB Helm repository is already added."
  when:
    - "'master' in group_names"
    - metallb_repo_present

- name: Update Helm repository list
  ansible.builtin.command:
    cmd: helm repo update
  become: true
  become_user: "{{ ansible_user }}"
  when: 
    - "'master' in group_names"

- name: Count the number of master nodes
  set_fact:
    master_count: "{{ groups['master'] | length | int }}"
  when: "'master' in group_names"
  run_once: true

- name: Set metallb values file for HA (3+ masters)
  set_fact:
    metallb_values_file: "{{ user_home_directory }}/my-charts/metallb/values-ha.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) >= 3
  run_once: true

- name: Set metallb values file for single master
  set_fact:
    metallb_values_file: "{{ user_home_directory }}/my-charts/metallb/values-single-master.yml"
  when:
    - "'master' in group_names"
    - (master_count | default(0) | int) < 3
  run_once: true

- name: Install MetalLB using Helm
  ansible.builtin.command:
    cmd: helm upgrade --install metallb metallb/metallb --namespace metallb-system --create-namespace {{ ('--version ' ~ metallb_chart_version) if metallb_chart_version else '' }} -f {{ metallb_values_file }}
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  register: metallb_helm_result
  until: metallb_helm_result.rc == 0
  retries: 5
  delay: 30
  when: inventory_hostname == groups['master'][0]

# IPAddressPool/L2Advertisement bir validating webhook'tan gecer; webhook'u
# metallb-controller servis eder. Deployment Available olana kadar beklemek
# endpoint'in hazir oldugunu garanti eder (pod "Running" olmasi yetmez).
- name: Wait for MetalLB controller to become available (webhook icin)
  ansible.builtin.command:
    cmd: kubectl wait --namespace metallb-system --for=condition=Available --timeout=300s deployment/metallb-controller
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  changed_when: false
  when: inventory_hostname == groups['master'][0]

- name: Render MetalLB IPAddressPool config from variables
  ansible.builtin.template:
    src: metallb-config.yml.j2
    dest: "{{ user_home_directory }}/my-charts/metallb/metallb-config.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: inventory_hostname == groups['master'][0]

- name: Apply MetalLB ConfigMap
  ansible.builtin.command:
    cmd: kubectl apply -f {{ user_home_directory }}/my-charts/metallb/metallb-config.yml
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    KUBECONFIG: "{{ user_home_directory }}/.kube/config"
  # Controller Available olsa da webhook caBundle'inin yayilmasi birkac saniye
  # surebiliyor; tek deneme yerine kisa araliklarla tekrar dene.
  register: metallb_config_apply
  until: metallb_config_apply.rc == 0
  retries: 6
  delay: 10
  when: inventory_hostname == groups['master'][0]
