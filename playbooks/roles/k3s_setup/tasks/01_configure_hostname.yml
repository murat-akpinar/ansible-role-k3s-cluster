---
# ============================
# Change Hostname
# ============================
# hostnamectl aninda etkilidir, reboot gerekmez. Eskiden hostname degisince node
# yeniden baslatiliyordu (10 dk timeout + 60 sn bekleme); add_node.yml `hosts: all`
# oldugu icin bu cluster'daki canli node'lari da kapsiyordu (todo B5).
# use: systemd -> eskisi gibi hostnamectl; modul dokumani RHEL 7+ icin bunu istiyor.
- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd
  become: true
  register: hostname_result

# Handler degil: handler play sonunda kosar, /etc/hosts k3s kurulumundan sonra
# guncellenirdi.
- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
  when: hostname_result is changed  # noqa: no-handler
  become: true
