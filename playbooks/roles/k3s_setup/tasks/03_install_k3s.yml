---
# ============================
# Install k3s Kubernetes Cluster
# ============================
# HA (3+ master) ve single-master yolu icin TEK blok. Iki yol arasindaki tek
# fark, katilan node'un konustugu adres: `k3s_api_endpoint` (_facts.yml) 3+
# master'da Keepalived VIP'i, altinda ilk master'in IP'sini verir. Eskiden bu
# dosyada iki birebir kopya blok vardi (~300 satir); birinde yapilan duzeltme
# digerine gecmiyordu (or. worker'da k3s-agent'i enable eden task yalnizca
# single kopyasindaydi).

- name: "Report the cluster topology"
  ansible.builtin.debug:
    msg: >-
      {{ master_count }} master, {{ groups['worker'] | default([]) | length }} worker —
      {{ 'HA (Keepalived VIP)' if (master_count | int) >= 3 else 'single-master' }},
      join endpoint: https://{{ k3s_api_endpoint }}:6443
  run_once: true
  delegate_to: "{{ groups['master'][0] }}"

# ---------------------------------------------------------------------------
# 1) Ilk master: cluster'i kuran node
# ---------------------------------------------------------------------------
- name: "First master"
  when: inventory_hostname == groups['master'][0]
  become: true
  block:
    - name: Check if K3s is already installed on the first master
      ansible.builtin.command: systemctl is-active k3s  # noqa: command-instead-of-module
      register: k3s_first_master_status
      failed_when: false
      changed_when: false

    # --cluster-init single-master'da da veriliyor: datastore etcd olur ve
    # cluster sonradan master eklenerek HA'ya cevrilebilir (sqlite'ta cevrilemez).
    - name: Install K3s on the first master node
      ansible.builtin.shell: |
        set -o pipefail
        {% if k3s_version_env | default('') != '' %}
        export {{ k3s_version_env }}
        {% endif %}
        curl -sfL {{ k3s_install_url }} | sh -s - server --cluster-init {{ k3s_server_args }}
      when: k3s_first_master_status.rc != 0
      args:
        executable: /bin/bash
      changed_when: true
      register: k3s_install_first_master

    - name: Ensure K3s is enabled and running on the first master node
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for K3s server to become ready on the first master node
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
      retries: 5
      delay: 10

# ---------------------------------------------------------------------------
# 2) Token'lar (ilk master'dan bir kez okunur, tum host'lara dagilir)
# ---------------------------------------------------------------------------
- name: Retrieve K3s server token from the first master node
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  become: true
  run_once: true
  delegate_to: "{{ groups['master'][0] }}"
  changed_when: false
  failed_when: false

- name: Set K3s server token fact (for all hosts)
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[groups['master'][0]]['k3s_token_raw'].stdout | default('') }}"
  when:
    - hostvars[groups['master'][0]]['k3s_token_raw'] is defined
    - hostvars[groups['master'][0]]['k3s_token_raw'].stdout is defined

# Worker'lar SERVER token'i ile degil agent token'i ile katilir: server
# token'i tasiyan bir worker ele gecirilirse saldirgan cluster'a yeni bir
# server ekleyip etcd'deki her Secret'a ulasir. agent-token dosyasi her zaman
# vardir; k3s_agent_token bos ise server token'ina link'tir (eski davranis).
- name: "Hardening | Retrieve K3s agent token from the first master node"
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/agent-token
  register: k3s_agent_token_raw
  become: true
  run_once: true
  delegate_to: "{{ groups['master'][0] }}"
  changed_when: false
  failed_when: false

# ---------------------------------------------------------------------------
# 3) Diger master'lar: cluster'a katilir
# ---------------------------------------------------------------------------
- name: "Additional masters"
  when:
    - "'master' in group_names"
    - inventory_hostname != groups['master'][0]
  become: true
  block:
    - name: Check if K3s is already installed on the additional master
      ansible.builtin.command: systemctl is-active k3s  # noqa: command-instead-of-module
      register: k3s_additional_master_status
      failed_when: false
      changed_when: false

    - name: Install K3s on the additional master node
      ansible.builtin.shell: |
        set -o pipefail
        export K3S_TOKEN="{{ k3s_token | default('') }}"
        export K3S_URL="https://{{ k3s_api_endpoint }}:6443"
        export INSTALL_K3S_EXEC="server --server $K3S_URL {{ k3s_server_args }}"
        {% if k3s_version_env | default('') != '' %}
        export {{ k3s_version_env }}
        {% endif %}
        curl -sfL {{ k3s_install_url }} | sh -
      when:
        - k3s_additional_master_status.rc != 0
        - (k3s_token | default('')) != ''
      args:
        executable: /bin/bash
      changed_when: true
      register: join_additional_master
      retries: 3
      delay: 15
      until: join_additional_master is succeeded

    - name: Ensure K3s is enabled and running on the additional master node
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for k3s.yaml to be created on the additional master node
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
      retries: 10
      delay: 10

# ---------------------------------------------------------------------------
# 4) Worker'lar
# ---------------------------------------------------------------------------
- name: "Workers"
  when: "'worker' in group_names"
  become: true
  block:
    - name: Check if the K3s agent is already installed on the worker node
      ansible.builtin.command: systemctl is-active k3s-agent  # noqa: command-instead-of-module
      register: k3s_worker_agent_status
      failed_when: false
      changed_when: false

    - name: Install the K3s agent on the worker node
      ansible.builtin.shell: |
        set -o pipefail
        export K3S_URL="https://{{ k3s_api_endpoint }}:6443"
        export K3S_TOKEN="{{ hostvars[groups['master'][0]]['k3s_agent_token_raw'].stdout | default('') }}"
        {% if k3s_version_env | default('') != '' %}
        export {{ k3s_version_env }}
        {% endif %}
        curl -sfL {{ k3s_install_url }} | sh -s - agent
      when:
        - k3s_worker_agent_status.rc != 0
        - hostvars[groups['master'][0]]['k3s_agent_token_raw'] is defined
        - hostvars[groups['master'][0]]['k3s_agent_token_raw'].stdout is defined
      args:
        executable: /bin/bash
      changed_when: true
      register: join_worker

    - name: Ensure the K3s agent is enabled and running on the worker node
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started

# ---------------------------------------------------------------------------
# 5) Durum ozeti
# ---------------------------------------------------------------------------
# state verilmeden systemd_service yalnizca durumu okur, unit yoksa da dusmez.
- name: Check K3s service status
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if 'master' in group_names else 'k3s-agent' }}"
  register: k3s_unit
  become: true

- name: Debug K3s service status
  ansible.builtin.debug:
    msg: "{{ k3s_unit.name }}: {{ k3s_unit.status.ActiveState }} (MainPID {{ k3s_unit.status.MainPID }})"

# kubeconfig dagitimi (.kube/config + .bashrc) artik 03_k3s_post_install.yml'de:
# k3s.yaml 0600 oldugu icin symlink degil kopya gerekiyor ve sonradan eklenen
# master'lar da ayni adimi almali (extra_node_cluster / update_cluster cagiriyor).
