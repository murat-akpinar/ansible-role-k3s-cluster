---
# Main tasks for adding extra nodes to existing K3s cluster

# user_home_directory tek kaynaktan (k3s_setup/tasks/_resolve_user.yml) gelir.
- name: "Resolve ansible_user home directory"
  ansible.builtin.include_role:
    name: k3s_setup
    tasks_from: _resolve_user

- name: "Ensure prerequisite packages are installed (acl + Longhorn storage deps)"
  ansible.builtin.package:
    # Paket isimleri OS ailesine gore degisir; ansible.builtin.package paket
    # yoneticisini (apt/dnf/yum) otomatik secer. Bilinmeyen aile Debian'a duser.
    name: "{{ _prereq_packages[ansible_os_family] | default(_prereq_packages['Debian']) }}"
    state: present
  become: true
  vars:
    _prereq_packages:
      Debian:                      # Ubuntu / Debian
        - acl                      # become (unprivileged user) icin; yoksa setfacl hatasi
        - open-iscsi               # Longhorn zorunlu: iSCSI ile volume attach
        - nfs-common               # Longhorn RWX (ReadWriteMany) volume'lari icin
      RedHat:                      # RHEL / Rocky / AlmaLinux
        - acl
        - iscsi-initiator-utils    # open-iscsi'nin RHEL karsiligi
        - nfs-utils                # nfs-common'in RHEL karsiligi

- name: "Ensure iscsid service is enabled and running (Longhorn icin)"
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  become: true

- name: "Configure System Requirements (Hostname and NTP)"
  ansible.builtin.import_tasks: 00_system_requirements.yml

- name: "Check if node is already part of cluster"
  ansible.builtin.import_tasks: 01_check_existing_node.yml

- name: "Add Master Node to Cluster"
  ansible.builtin.import_tasks: 02_add_master_node.yml
  when: "'master' in group_names"

# Keepalived kurulumu k3s_setup ile birebir ayniydi; kopya yerine kaynagi cagiriyoruz.
- name: "Install and Configure Keepalived (if 3+ masters after adding nodes)"
  ansible.builtin.include_role:
    name: k3s_setup
    tasks_from: 02_install_keepalived
  when: "'master' in group_names"

- name: "Add Worker Node to Cluster"
  ansible.builtin.import_tasks: 03_add_worker_node.yml
  when: "'worker' in group_names"

