---
# Upgrade Master Nodes with Rolling Update Strategy
#
# TEK blok: ilk master ile diger master'lar arasindaki fark yalnizca kurulum
# satiri (ilk master `--cluster-init`, digerleri `--server $K3S_URL`), katilma
# adresi de `k3s_api_endpoint`'ten (_facts.yml) geliyor. Eskiden ayni drain /
# wait / uncordon dizisi uc kez kopyaliydi (ilk master HA, ek master HA, tek
# master) ve 2 master'li bir cluster'da IKINCI master hicbir bloga uymadigi
# icin sessizce upgrade edilmiyordu.

- name: Get K3s token from first master (for additional masters to rejoin)
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  when: upgrade_needed | default(true)
  become: true
  changed_when: false
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true

- name: Set K3s token fact (for all masters)
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.stdout | default('') }}"
  when: k3s_token_raw.stdout is defined

# Master'da drain YOK, yalnizca cordon: k3s dururken container'lar calismaya
# devam eder (.tmp/k3s/upgrades-manual.md); system-upgrade-controller ornegi de
# server'lar icin yalnizca `cordon: true` kullanir. Drain tek master'da tum
# pod'lari gidecek yeri olmadan tahliye ediyordu ve Longhorn'un son replikayi
# koruyan PDB'si drain'i timeout'a kadar bloklayip upgrade'i durduruyordu (todo A12).
- name: Upgrade master node
  when: upgrade_needed | default(true)
  block:
    - name: Cordon master node
      ansible.builtin.command:
        cmd: kubectl cordon {{ inventory_hostname }}
      changed_when: true
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"

    - name: Upgrade K3s on the first master (cluster-init)
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL {{ k3s_install_url }} | INSTALL_K3S_VERSION={{ k3s_target_version }} sh -s - server --cluster-init {{ k3s_server_args }}
      when: inventory_hostname == groups['master'][0]
      become: true
      args:
        executable: /bin/bash
      changed_when: true
      register: upgrade_first_master

    - name: Upgrade K3s on an additional master
      ansible.builtin.shell: |
        set -o pipefail
        export K3S_TOKEN="{{ k3s_token }}"
        export K3S_URL="https://{{ k3s_api_endpoint }}:6443"
        export INSTALL_K3S_VERSION={{ k3s_target_version }}
        export INSTALL_K3S_EXEC="server --server $K3S_URL {{ k3s_server_args }}"
        curl -sfL {{ k3s_install_url }} | sh -
      when: inventory_hostname != groups['master'][0]
      become: true
      args:
        executable: /bin/bash
      changed_when: true
      register: upgrade_additional_master

    - name: Wait for K3s to be ready on master node
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
      become: true
      retries: 10
      delay: 10

    - name: Wait for pods to stabilize after master upgrade
      ansible.builtin.pause:
        seconds: "{{ upgrade_wait_for_pods }}"

  # always: upgrade yarida fail etse de node cordon'lu kalmasin.
  always:
    - name: Uncordon master node
      ansible.builtin.command:
        cmd: kubectl uncordon {{ inventory_hostname }}
      changed_when: true
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
