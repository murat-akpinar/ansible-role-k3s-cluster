---
# Upgrade Worker Nodes with Rolling Update Strategy
#
# TEK blok: HA ve single-master yolu arasindaki tek fark agent'in konustugu
# adresti (`k3s_api_endpoint`, _facts.yml). Eskiden bu dosya 310 satirlik iki
# birebir kopyadan olusuyordu; register adlari disinda hicbir farklari yoktu.

# Worker'lar SERVER token'i ile degil agent token'i ile katilir (bkz.
# k3s_setup/tasks/03_install_k3s.yml).
- name: Get K3s agent token from first master (for workers to join)
  shell: cat /var/lib/rancher/k3s/server/agent-token
  register: k3s_token_raw
  become: true
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['master'][0] }}"

- name: Set K3s token fact (for all workers)
  set_fact:
    k3s_token: "{{ k3s_token_raw.stdout | default('') }}"
  when: k3s_token_raw.stdout is defined

- name: Upgrade worker node
  block:
    - name: Check pods on worker node before drain
      ansible.builtin.shell:
        cmd: kubectl get pods --all-namespaces --field-selector spec.nodeName={{ inventory_hostname }} -o wide --no-headers | wc -l
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      register: pods_count_before
      changed_when: false

    - name: Check PVC pods on worker node before drain
      ansible.builtin.shell:
        cmd: kubectl get pods --all-namespaces --field-selector spec.nodeName={{ inventory_hostname }} -o jsonpath='{range .items[*]}{.metadata.namespace}{\"/\"}{.metadata.name}{\" \"}{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{\" \"}{end}{\"\\n\"}{end}' | grep -v '^$' || echo "No PVC pods"
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      register: pvc_pods_before
      changed_when: false
      failed_when: false

    - name: Display worker node status before drain
      ansible.builtin.debug:
        msg: |
          Worker node {{ inventory_hostname }} status before drain:
          - Total pods: {{ pods_count_before.stdout | trim }}
          - PVC pods: {{ pvc_pods_before.stdout | default('None') }}

    - name: Drain worker node
      ansible.builtin.command:
        cmd: kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --timeout={{ upgrade_drain_timeout }}s --grace-period={{ upgrade_drain_grace_period | default(60) }} --force
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      register: drain_worker_result
      failed_when: false
      changed_when: drain_worker_result.rc == 0

    - name: Display drain output for debugging
      ansible.builtin.debug:
        msg: |
          Drain output for {{ inventory_hostname }}:
          STDOUT: {{ drain_worker_result.stdout | default('None') }}
          STDERR: {{ drain_worker_result.stderr | default('None') }}
          Return code: {{ drain_worker_result.rc }}

    - name: Check pods that could not be evicted
      ansible.builtin.shell:
        cmd: kubectl get pods --all-namespaces --field-selector spec.nodeName={{ inventory_hostname }} --no-headers 2>/dev/null | awk '{print $1"/"$2}' || echo "No pods remaining"
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      when: 
        - drain_worker_result.rc != 0
      delegate_to: "{{ groups['master'][0] }}"
      register: remaining_pods
      changed_when: false
      failed_when: false

    - name: Display pods that could not be evicted
      ansible.builtin.debug:
        msg: |
          Pods that could not be evicted from {{ inventory_hostname }}:
          {{ remaining_pods.stdout | default('None') }}
      when: 
        - drain_worker_result.rc != 0
        - remaining_pods.stdout is defined

    - name: Check if drain was successful
      ansible.builtin.debug:
        msg: "Drain completed successfully for {{ inventory_hostname }}"
      when: 
        - drain_worker_result.rc == 0

    - name: Warn if drain had issues (may continue with force)
      ansible.builtin.debug:
        msg: "Drain had issues for {{ inventory_hostname }}, but continuing with upgrade (some pods may not have been evicted)"
      when: 
        - drain_worker_result.rc != 0

    - name: Upgrade K3s agent on worker
      shell: |
        export K3S_URL="https://{{ k3s_api_endpoint }}:6443"
        export K3S_TOKEN="{{ k3s_token }}"
        export INSTALL_K3S_VERSION={{ k3s_target_version }}
        curl -sfL {{ k3s_install_url }} | sh -s - agent
      become: true
      register: upgrade_worker

    - name: Wait for K3s agent service to be running
      ansible.builtin.command:
        cmd: systemctl is-active k3s-agent
      register: k3s_agent_status
      until: k3s_agent_status.rc == 0
      retries: 12
      delay: 5
      become: true
      changed_when: false

    - name: Wait for worker node to be Ready in cluster
      ansible.builtin.shell:
        cmd: kubectl get nodes {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -q True
      register: worker_ready_check
      until: worker_ready_check.rc == 0
      retries: 12
      delay: 5
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      changed_when: false
      failed_when: false

    # Beklemeler uyari niteliginde: zaman asiminda task kirmizi "...ignoring"
    # basar, upgrade durmaz. Eskiden bash dongusuydu; /bin/sh (dash) altinda hic
    # beklemiyordu (todo A5).
    - name: Wait for Longhorn pods on worker to be Ready after upgrade
      ansible.builtin.command:
        cmd: >-
          kubectl wait pod -n longhorn-system --for=condition=Ready --timeout=120s
          --field-selector spec.nodeName={{ inventory_hostname }},status.phase!=Succeeded,status.phase!=Failed
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      changed_when: false
      ignore_errors: true
      when: longhorn_install | bool

    # Siradaki worker drain edilmeden once replikalar tamamlanmali.
    # robustness: healthy | degraded | faulted | unknown (detached volume).
    - name: Wait for Longhorn volumes to finish rebuilding after upgrade
      ansible.builtin.command:
        cmd: kubectl get volumes.longhorn.io -n longhorn-system -o jsonpath='{.items[*].status.robustness}'
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      register: longhorn_volumes
      until: longhorn_volumes.rc == 0 and 'degraded' not in longhorn_volumes.stdout
      retries: 30
      delay: 10
      changed_when: false
      ignore_errors: true
      when: longhorn_install | bool

    - name: Uncordon worker node
      ansible.builtin.command:
        cmd: kubectl uncordon {{ inventory_hostname }}
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"

    # Uncordon'dan SONRA: tek worker'li cluster'da tahliye edilen pod'lar ancak
    # simdi schedule olabilir.
    - name: Wait for monitoring pods to be Ready after upgrade
      ansible.builtin.command:
        cmd: >-
          kubectl wait pod -n monitoring --for=condition=Ready --timeout=180s
          --field-selector status.phase!=Succeeded,status.phase!=Failed
      become: true
      become_user: "{{ ansible_user }}"
      environment:
        KUBECONFIG: "{{ user_home_directory }}/.kube/config"
      delegate_to: "{{ groups['master'][0] }}"
      changed_when: false
      ignore_errors: true
      when: grafana_install | bool

    - name: Wait for pods to stabilize after worker upgrade
      ansible.builtin.pause:
        seconds: "{{ upgrade_wait_for_pods }}"

  when: 
    - "'worker' in group_names"
    - upgrade_needed | default(true)
