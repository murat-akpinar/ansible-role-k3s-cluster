[defaults]
inventory=inventory/cluster_inventory.yml
ask_pass=false
interpreter_python=auto_silent
host_key_checking = False
# Enable playbook run summary (per-task profiling + total timer)
callbacks_enabled=ansible.posix.profile_tasks, ansible.posix.timer
roles_path=playbooks/roles

[privilege_escalation]
become=true
become_user=root
become_ask_pass=false
become_method=sudo

[ssh_connection]
# ControlPath verilmez: Ansible varsayilani ~/.ansible/cp/%C (hash'li, kullaniciya ozel).
# Eskiden /tmp/ansible-ssh-%h-%p-%r idi; herkesin yazabildigi /tmp'de tahmin
# edilebilir soket yolu (todo D3).
ssh_args=-o ControlMaster=auto -o ServerAliveInterval=60 -o ControlPersist=60s

[callback_profile_tasks]
# List tasks in execution order in the run summary
sort_order = none
